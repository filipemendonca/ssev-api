# render.yaml

services:
  - type: web
    name: ssev-api
    runtime: docker
    repo: https://github.com/filipemendonca/ssev-api
    branch: main
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ssev
          property: connectionString

databases:
  - name: ssev
    plan: free
